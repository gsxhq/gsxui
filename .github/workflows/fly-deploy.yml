# Deploys the showcase site (ui.gsxhq.dev) on every push to main: run the
# Go test suite and the Playwright suite, then `flyctl deploy` with Fly's
# remote builder (the Docker build itself — vite build + go build — is the
# compile gate; see site/Dockerfile). Auth is an app-scoped deploy token in
# the FLY_API_TOKEN repo secret (`flyctl tokens create deploy`).
name: fly-deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser binaries live outside node_modules, so npm's cache doesn't
      # cover them. Key on the lockfile: a Playwright version bump invalidates.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps also apt-installs system shared libraries (libnss3,
      # libatk-bridge2.0-0, ...) into system paths the cache above never
      # covers. Runners are fresh VMs per job, so a cache hit still needs
      # those reinstalled every run — only the browser binary itself is
      # skippable.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: go test ./...
      - run: make test-js
      # The HTML reporter (jstest/playwright.config.ts) is what actually
      # populates this directory with traces; upload-artifact's default
      # if-no-files-found: warn would otherwise silently no-op.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jstest/playwright-report/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # One deploy at a time; a queued deploy for a newer commit supersedes.
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
